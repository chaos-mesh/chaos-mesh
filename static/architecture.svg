<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Chaos Mesh architecture</title>
  <desc id="desc">Users and the Chaos Dashboard manage Chaos Mesh custom resources through the Kubernetes API. The Chaos Controller Manager reconciles those resources and controls Chaos Daemon instances, cloud and physical infrastructure, and remote Kubernetes clusters.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#172554" flood-opacity="0.10" />
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e54b38" />
    </marker>
    <style>
      .title { font: 700 24px Arial, Helvetica, sans-serif; fill: #172554; }
      .section { font: 700 18px Arial, Helvetica, sans-serif; fill: #172554; }
      .box-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #172554; }
      .label { font: 500 14px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 500 12px Arial, Helvetica, sans-serif; fill: #475569; }
      .arrow-label { font: 600 12px Arial, Helvetica, sans-serif; fill: #1d4ed8; }
      .arrow-label-orange { font: 600 12px Arial, Helvetica, sans-serif; fill: #c2412d; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#ffffff" />
  <text x="60" y="48" class="title">Chaos Mesh high-level architecture</text>

  <!-- Entry points -->
  <rect x="70" y="78" width="290" height="108" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)" />
  <text x="215" y="112" text-anchor="middle" class="box-title">Chaos Dashboard</text>
  <text x="215" y="139" text-anchor="middle" class="label">Web UI + HTTP API</text>
  <text x="215" y="163" text-anchor="middle" class="small">Optional management interface</text>

  <rect x="455" y="68" width="290" height="128" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)" />
  <text x="600" y="104" text-anchor="middle" class="box-title">Kubernetes API server</text>
  <text x="600" y="132" text-anchor="middle" class="label">Chaos Mesh custom resources</text>
  <text x="600" y="157" text-anchor="middle" class="small">Experiments · Schedule · Workflow</text>
  <text x="600" y="178" text-anchor="middle" class="small">StatusCheck · RemoteCluster</text>

  <rect x="840" y="78" width="290" height="108" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)" />
  <text x="985" y="112" text-anchor="middle" class="box-title">Kubernetes clients</text>
  <text x="985" y="139" text-anchor="middle" class="label">kubectl · Kubernetes API clients</text>
  <text x="985" y="163" text-anchor="middle" class="small">Create and inspect resources</text>

  <path d="M 360 132 H 455" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <path d="M 840 132 H 745" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <text x="408" y="120" text-anchor="middle" class="arrow-label">CRUD</text>
  <text x="792" y="120" text-anchor="middle" class="arrow-label">CRUD</text>

  <!-- Control plane -->
  <rect x="70" y="250" width="1060" height="252" rx="22" fill="#fff8f5" stroke="#f3a294" stroke-width="2" />
  <text x="100" y="285" class="section">Chaos Mesh control plane</text>

  <rect x="105" y="305" width="990" height="165" rx="18" fill="#fff1eb" stroke="#e85d48" stroke-width="2.5" filter="url(#shadow)" />
  <text x="600" y="338" text-anchor="middle" class="box-title">Chaos Controller Manager</text>

  <rect x="135" y="362" width="205" height="78" rx="12" fill="#ffffff" stroke="#f3a294" stroke-width="1.5" />
  <text x="237" y="391" text-anchor="middle" class="label">Admission webhooks</text>
  <text x="237" y="416" text-anchor="middle" class="small">Validate and default CRDs</text>

  <rect x="365" y="362" width="205" height="78" rx="12" fill="#ffffff" stroke="#f3a294" stroke-width="1.5" />
  <text x="467" y="391" text-anchor="middle" class="label">Chaos controllers</text>
  <text x="467" y="416" text-anchor="middle" class="small">Inject · monitor · recover</text>

  <rect x="595" y="362" width="205" height="78" rx="12" fill="#ffffff" stroke="#f3a294" stroke-width="1.5" />
  <text x="697" y="391" text-anchor="middle" class="label">Experiment orchestration</text>
  <text x="697" y="416" text-anchor="middle" class="small">Schedule · Workflow · StatusCheck</text>

  <rect x="825" y="362" width="235" height="78" rx="12" fill="#ffffff" stroke="#f3a294" stroke-width="1.5" />
  <text x="942" y="391" text-anchor="middle" class="label">Multi-cluster controllers</text>
  <text x="942" y="416" text-anchor="middle" class="small">Dispatch and synchronize chaos</text>

  <path d="M 600 196 V 305" fill="none" stroke="#2563eb" stroke-width="2.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)" />
  <rect x="616" y="219" width="178" height="24" rx="12" fill="#ffffff" />
  <text x="705" y="236" text-anchor="middle" class="arrow-label">watch · reconcile · status</text>

  <!-- Execution targets -->
  <rect x="70" y="555" width="535" height="150" rx="20" fill="#f0fdf4" stroke="#22a06b" stroke-width="2" />
  <text x="100" y="588" class="section">Kubernetes worker nodes</text>

  <rect x="100" y="610" width="205" height="68" rx="12" fill="#ffffff" stroke="#22a06b" stroke-width="1.8" filter="url(#shadow)" />
  <text x="202" y="638" text-anchor="middle" class="box-title">Chaos Daemon</text>
  <text x="202" y="660" text-anchor="middle" class="small">Privileged DaemonSet</text>

  <rect x="365" y="610" width="210" height="68" rx="12" fill="#ffffff" stroke="#22a06b" stroke-width="1.8" />
  <text x="470" y="636" text-anchor="middle" class="label">Workloads + node resources</text>
  <text x="470" y="658" text-anchor="middle" class="small">runtime · network · filesystem · kernel</text>

  <path d="M 305 644 H 365" fill="none" stroke="#e54b38" stroke-width="2.5" marker-end="url(#arrow-orange)" />
  <text x="335" y="631" text-anchor="middle" class="arrow-label-orange">inject</text>

  <rect x="645" y="555" width="485" height="150" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" />
  <text x="675" y="588" class="section">External and remote targets</text>

  <rect x="675" y="610" width="125" height="68" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
  <text x="737" y="637" text-anchor="middle" class="label">Cloud APIs</text>
  <text x="737" y="659" text-anchor="middle" class="small">AWS · Azure · GCP</text>

  <rect x="825" y="610" width="125" height="68" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
  <text x="887" y="637" text-anchor="middle" class="label">Physical machines</text>
  <text x="887" y="659" text-anchor="middle" class="small">Host-level faults</text>

  <rect x="975" y="610" width="125" height="68" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
  <text x="1037" y="637" text-anchor="middle" class="label">Remote clusters</text>
  <text x="1037" y="659" text-anchor="middle" class="small">Managed experiments</text>

  <path d="M 467 440 V 520 H 202 V 610" fill="none" stroke="#e54b38" stroke-width="2.5" marker-end="url(#arrow-orange)" />
  <rect x="262" y="507" width="116" height="24" rx="12" fill="#ffffff" />
  <text x="320" y="524" text-anchor="middle" class="arrow-label-orange">gRPC control</text>

  <path d="M 520 440 V 530 H 887" fill="none" stroke="#e54b38" stroke-width="2.5" />
  <path d="M 737 530 V 610" fill="none" stroke="#e54b38" stroke-width="2.5" marker-end="url(#arrow-orange)" />
  <path d="M 887 530 V 610" fill="none" stroke="#e54b38" stroke-width="2.5" marker-end="url(#arrow-orange)" />
  <text x="650" y="521" text-anchor="middle" class="arrow-label-orange">external APIs</text>

  <path d="M 942 440 V 530 H 1037 V 610" fill="none" stroke="#e54b38" stroke-width="2.5" marker-end="url(#arrow-orange)" />
  <text x="1000" y="521" text-anchor="middle" class="arrow-label-orange">remote API</text>

  <text x="600" y="738" text-anchor="middle" class="small">Solid arrows show the primary control and reconciliation paths.</text>
</svg>
