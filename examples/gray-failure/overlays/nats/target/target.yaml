# The NATS StatefulSet pods a gray failure is injected into. To keep every
# workflow step on the same node, or to hit the JetStream meta-leader, replace
# labelSelectors with a pinned pod, for example:
#   pods:
#     nats:
#       - nats-1
apiVersion: gray-failure.chaos-mesh.org/v1
kind: Target
metadata:
  name: nats
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  mode: one
  selector:
    namespaces:
      - nats
    labelSelectors:
      app.kubernetes.io/name: nats
