# Replays the incident: 40% of the traffic of one node is dropped inbound,
# then outbound, then both, with a recovery pause between each step.
# Every step selects its victim independently; pin a single pod in the target
# to keep all steps on the same node.
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: gray-failure-incident
spec:
  entry: incident
  templates:
    - name: incident
      templateType: Serial
      deadline: 30m
      children:
        - inbound
        - recover-after-inbound
        - outbound
        - recover-after-outbound
        - both
    - name: inbound
      templateType: NetworkChaos
      deadline: 5m
      networkChaos:
        action: partition
        mode: one
        selector:
          namespaces:
            - REPLACED-BY-TARGET
        direction: from
        partition:
          dropPercent: "40"
        scope: node
        includeHost: true
    - name: recover-after-inbound
      templateType: Suspend
      deadline: 5m
    - name: outbound
      templateType: NetworkChaos
      deadline: 5m
      networkChaos:
        action: partition
        mode: one
        selector:
          namespaces:
            - REPLACED-BY-TARGET
        direction: to
        partition:
          dropPercent: "40"
        scope: node
        includeHost: true
    - name: recover-after-outbound
      templateType: Suspend
      deadline: 5m
    - name: both
      templateType: NetworkChaos
      deadline: 5m
      networkChaos:
        action: partition
        mode: one
        selector:
          namespaces:
            - REPLACED-BY-TARGET
        direction: both
        partition:
          dropPercent: "40"
        scope: node
        includeHost: true
