# Drops 40% of the NATS leafnode (7422) and gateway (7522) traffic of the
# victim pod, in both directions. These carry the edge and cross-cluster links;
# check the nats-server config enables them, otherwise this is a no-op.
# Two /1 ranges stand for "any address" since ipset rejects /0.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: NetworkChaos
    patch: |-
      - op: replace
        path: /spec/direction
        value: both
      - op: replace
        path: /spec/partition/dropPercent
        value: "40"
      - op: add
        path: /spec/scope
        value: pod
      - op: add
        path: /spec/externalTargets
        value:
          - 0.0.0.0/1:7422
          - 128.0.0.0/1:7422
          - 0.0.0.0/1:7522
          - 128.0.0.0/1:7522
