# Drops 40% of the traffic entering the node of the victim: every pod on it and its host network namespace.
# Traffic that stays on the node is not dropped.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: NetworkChaos
    patch: |-
      - op: replace
        path: /spec/direction
        value: from
      - op: replace
        path: /spec/partition/dropPercent
        value: "40"
      - op: add
        path: /spec/scope
        value: node
      - op: add
        path: /spec/includeHost
        value: true
