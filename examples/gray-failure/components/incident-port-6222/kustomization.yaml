# Drops 40% of the NATS cluster route traffic of the victim pod: inbound
# connections to its port 6222 and its outbound connections to the 6222 port
# of peers. Routes carry cluster membership and JetStream RAFT replication.
# Two /1 ranges stand for "any address" since ipset rejects /0.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: NetworkChaos
    patch: |-
      - op: replace
        path: /spec/direction
        value: both
      - op: replace
        path: /spec/partition/dropPercent
        value: "40"
      - op: add
        path: /spec/scope
        value: pod
      - op: add
        path: /spec/externalTargets
        value:
          - 0.0.0.0/1:6222
          - 128.0.0.0/1:6222
