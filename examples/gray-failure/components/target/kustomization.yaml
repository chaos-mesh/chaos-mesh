# Copies the selector and mode of the overlay's Target into every chaos.
# The overlay must provide a Target resource annotated with
# config.kubernetes.io/local-config: "true" so it is not emitted, and must
# list this component last.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replacements:
  - source:
      kind: Target
      fieldPath: spec.selector
    targets:
      - select:
          kind: NetworkChaos
        fieldPaths:
          - spec.selector
      - select:
          kind: Workflow
        fieldPaths:
          - spec.templates.*.networkChaos.selector
  - source:
      kind: Target
      fieldPath: spec.mode
    targets:
      - select:
          kind: NetworkChaos
        fieldPaths:
          - spec.mode
      - select:
          kind: Workflow
        fieldPaths:
          - spec.templates.*.networkChaos.mode
