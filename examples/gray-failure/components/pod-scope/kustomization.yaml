# Runs the incident workflow in the pod network namespace of the victim only,
# leaving the other pods on its node and the host untouched.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Workflow
      name: gray-failure-incident
    patch: |-
      - op: replace
        path: /spec/templates/1/networkChaos/scope
        value: pod
      - op: remove
        path: /spec/templates/1/networkChaos/includeHost
      - op: replace
        path: /spec/templates/3/networkChaos/scope
        value: pod
      - op: remove
        path: /spec/templates/3/networkChaos/includeHost
      - op: replace
        path: /spec/templates/5/networkChaos/scope
        value: pod
      - op: remove
        path: /spec/templates/5/networkChaos/includeHost
