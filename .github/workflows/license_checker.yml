# Note: If you change `paths-ignore` in this workflow,
# please also update the `files_ignore` in the `Get changed files` step accordingly.
#
# Because the `paths-ignore` is used to determine whether to trigger the workflow or not,
# while the `files_ignore` is used to determine which files to check for license headers.
name: License checker

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      # Repository and tool configuration
      - "**/*.json"
      - "**/.gitignore"
      - "**/.gitkeep"
      - ".dockerignore"
      - ".editorconfig"
      - ".github/**"
      - ".prettierrc"
      - "codecov.yml"
      - "revive.toml"

      # Documentation and static assets
      - "**/*.md"
      - ".well-known/**"
      - "static/**"

      # Build and dependency files
      - "**/*.proto"
      - "**/Dockerfile"
      - "**/go.mod"
      - "**/go.sum"
      - "*.mk"
      - "Makefile"
      - "env-images.yaml"
      - "helm/chaos-mesh/.helmignore"

      # Generated files and binaries
      - "**/*.pb.go"
      - "**/*_generated*"
      - "config/**"
      - "helm/chaos-mesh/crds/*"
      - "manifests/**"
      - "pkg/dashboard/swaggerdocs/docs.go"
      - "pkg/dashboard/swaggerdocs/swagger.yaml"
      - "pkg/time/fakeclock/.embed.o"

      # UI
      - "ui/**/*.svg"
      - "ui/.husky/**"
      - "ui/.prettierignore"
      - "ui/.prettierrc"
      - "ui/app/eslint.config.js"
      - "ui/app/index.html"
      - "ui/app/public/**"
      - "ui/app/src/formik/**"
      - "ui/app/src/openapi/**"
      - "ui/pnpm-lock.yaml"
      - "ui/pnpm-workspace.yaml"

concurrency:
  group: license_checker.yml-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  check-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_ignore: |
            **/*.json
            **/.gitignore
            **/.gitkeep
            .dockerignore
            .editorconfig
            .github/**
            .prettierrc
            codecov.yml
            revive.toml

            **/*.md
            .well-known/**
            static/**

            **/*.proto
            **/Dockerfile
            **/go.mod
            **/go.sum
            *.mk
            Makefile
            env-images.yaml
            helm/chaos-mesh/.helmignore

            **/*.pb.go
            **/*_generated*
            config/**
            helm/chaos-mesh/crds/*
            manifests/**
            pkg/dashboard/swaggerdocs/docs.go
            pkg/dashboard/swaggerdocs/swagger.yaml
            pkg/time/fakeclock/.embed.o

            ui/**/*.svg
            ui/.husky/**
            ui/.prettierignore
            ui/.prettierrc
            ui/app/eslint.config.js
            ui/app/index.html
            ui/app/public/**
            ui/app/src/formik/**
            ui/app/src/openapi/**
            ui/pnpm-lock.yaml
            ui/pnpm-workspace.yaml

      - name: Check license header for changed files
        env:
          ADDED_FILES: ${{ steps.changed-files.outputs.added_files }}
        run: |
          for file in ${ADDED_FILES}; do
            if ! grep -q "Licensed under the Apache License, Version 2.0" "$file"; then
              echo "License header is missing in $file."
              echo "Please check all added files have the license header before committing."
              exit 1
            fi
          done
