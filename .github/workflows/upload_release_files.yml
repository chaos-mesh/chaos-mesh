name: Upload tagged install related files to CDN

on:
  push:
    tags:
      - v*

permissions: read-all

jobs:
  run:
    if: github.repository_owner == 'chaos-mesh'
    name: Upload
    runs-on: ubuntu-24.04
    steps:
      - name: "Must Triggered by Tag v<version>"
        run: |
          # GITHUB_REF_TYPE MUST equals to "tag"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "This workflow must be triggered by tag"
            echo "GITHUB_REF_TYPE: ${GITHUB_REF_TYPE}"
            echo "GITHUB_REF: ${GITHUB_REF}"
            exit 1
          fi

          # The tag MUST start with "v"
          GIT_TAG=${GITHUB_REF##*/}
          if [[ "${GIT_TAG}" == "v"* ]]; then
            exit 0
          fi

          echo "The tag must start with 'v'"
          echo "GITHUB_REF: ${GITHUB_REF}"
          exit 1
      - uses: actions/checkout@v7
        with:
          # Must use at least depth 2!
          fetch-depth: 2

      - uses: actions/setup-go@v7
        with:
          check-latest: true
          go-version-file: "go.mod"
      - name: Build binary
        run: |
          make chaosctl

      - name: Update install.sh with Certain Version
        run: |
          GIT_TAG=${GITHUB_REF##*/}
          VERSION=${GIT_TAG##chart-}
          sed install.sh -i -e "s/^VERSION=.*/VERSION=${VERSION}/"

      - name: Upload files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        run: |
          destination="$AWS_BUCKET_NAME/$GITHUB_REF_NAME"
          aws s3 cp install.sh "$destination/install.sh"
          aws s3 cp manifests/crd.yaml "$destination/crd.yaml"
          aws s3 cp examples/web-show/deploy.sh "$destination/web-show/deploy.sh"
          aws s3 cp bin/chaosctl "$destination/chaosctl"
