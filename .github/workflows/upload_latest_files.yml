name: Upload latest install related files to CDN

on:
  push:
    branches:
      - master
    paths:
      - install.sh
      - manifests/crd.yaml
      - examples/web-show/deploy.sh
      - pkg/chaosctl/**
      - cmd/chaosctl/**

permissions: read-all

jobs:
  run:
    if: github.repository_owner == 'chaos-mesh'
    name: Upload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Must use at least depth 2!
          fetch-depth: 2

      - uses: actions/setup-go@v7
        with:
          check-latest: true
          go-version-file: "go.mod"
      - name: Build binary
        run: |
          make chaosctl

      - name: Upload files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        run: |
          destination="$AWS_BUCKET_NAME/latest"
          aws s3 cp install.sh "$destination/install.sh"
          aws s3 cp manifests/crd.yaml "$destination/crd.yaml"
          aws s3 cp examples/web-show/deploy.sh "$destination/web-show/deploy.sh"
          aws s3 cp bin/chaosctl "$destination/chaosctl"
