name: Kernel image qualification

on:
  pull_request:
    paths:
      - images/chaos-kernel/**
      - hack/check-kernel-image.sh
      - hack/kernel-minikube/**
      - .github/workflows/kernel_image.yml
  workflow_dispatch:

env:
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  minikube-lifecycle:
    needs: [kernel-image, component-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PROFILE: cm-kvm-${{ github.run_id }}-${{ github.run_attempt }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize evidence directory
        run: |
          EVIDENCE="$RUNNER_TEMP/kernel-minikube"
          mkdir -p "$EVIDENCE"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$RUNNER_TEMP/cm-minikube.kubeconfig" >> "$GITHUB_ENV"
      - name: Validate workflow expressions
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= \
            .github/workflows/kernel_image.yml 2>&1 | tee "$EVIDENCE/actionlint.log"
      - name: Check host KVM capability before installation
        id: host
        timeout-minutes: 1
        run: python3 hack/kernel-minikube/probe.py host "$PROFILE" "$EVIDENCE"
      - name: Initialize libvirt and runner access
        id: setup
        timeout-minutes: 4
        run: |
          {
            sudo apt-get -o Acquire::Retries=0 update
            sudo apt-get -o Acquire::Retries=0 install --no-install-recommends -y \
              qemu-kvm libvirt-daemon-system libvirt-clients acl dnsmasq-base
            command -v virsh
            sudo sh -c 'command -v dnsmasq'
            sudo systemctl start libvirtd
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm /var/run/libvirt/libvirt-sock
            python3 -c "import sys; sys.path.insert(0, 'hack/kernel-minikube'); from probe import KVM_API; exec(KVM_API)"
            virsh -c qemu:///system domcapabilities --virttype kvm
            active=$(virsh -c qemu:///system net-list --name)
            if ! grep -Fxq default <<< "$active"; then
              virsh -c qemu:///system net-start default
            fi
            virsh -c qemu:///system net-list --all --name > "$EVIDENCE/networks-before.txt"
            domains=$(virsh -c qemu:///system list --all --name)
            if grep -Fxq "$PROFILE" <<< "$domains"; then
              echo "Owned domain already exists before startup" >&2
              exit 1
            fi
          } 2>&1 | tee "$EVIDENCE/libvirt-setup.log"
      - name: Start stock minikube once
        id: start
        timeout-minutes: 10
        uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e
        with:
          minikube-version: '1.38.1'
          kubernetes-version: v1.34.5
          driver: kvm2
          container-runtime: containerd
          cpus: 2
          memory: 6144m
          nodes: 1
          wait: all
          start-args: --profile=${{ env.PROFILE }} --disk-size=16g --wait-timeout=8m --delete-on-failure=false
      - name: Bind the stock guest identity and prerequisites
        timeout-minutes: 3
        run: python3 hack/kernel-minikube/probe.py guest "$PROFILE" "$EVIDENCE"
      - uses: actions/download-artifact@v8
        with:
          name: cm-minikube-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/minikube-inputs
      - name: Qualify the actual sidecar and both bounded lifecycle cases
        timeout-minutes: 18
        run: python3 -B hack/kernel-minikube/qualify.py "$PROFILE" "$RUNNER_TEMP/minikube-inputs" "$EVIDENCE"
      - name: Collect diagnostics and delete the owned profile once
        if: always()
        timeout-minutes: 5
        env:
          HOST_OUTCOME: ${{ steps.host.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          START_OUTCOME: ${{ steps.start.outcome }}
        run: python3 hack/kernel-minikube/probe.py cleanup "$PROFILE" "$EVIDENCE"
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 1
        with:
          name: kernel-minikube-lifecycle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-minikube/
          if-no-files-found: error

  kernel-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build kernel image
        run: |
          mkdir -p "$RUNNER_TEMP/kernel-image-build"
          docker build --platform linux/${{ matrix.arch }} --build-arg MAKE_JOBS=2 \
            -t chaos-kernel:ci images/chaos-kernel 2>&1 | tee "$RUNNER_TEMP/kernel-image-build/build.log"
      - name: Check the installed image without injecting faults
        run: |
          hack/check-kernel-image.sh chaos-kernel:ci linux/${{ matrix.arch }} \
            2>&1 | tee "$RUNNER_TEMP/kernel-image-build/smoke.log"
      - name: Save the exact amd64 image for the guest
        if: matrix.arch == 'amd64'
        run: |
          mkdir "$RUNNER_TEMP/chaos-kernel-image"
          docker image inspect chaos-kernel:ci > "$RUNNER_TEMP/chaos-kernel-image/image-inspect.json"
          docker save chaos-kernel:ci | gzip -1 > "$RUNNER_TEMP/chaos-kernel-image/image.tar.gz"
          python3 images/chaos-kernel/guest/manifest.py image \
            "$RUNNER_TEMP/chaos-kernel-image/image.tar.gz" \
            "$RUNNER_TEMP/chaos-kernel-image/image-inspect.json" > "$RUNNER_TEMP/chaos-kernel-image/image.json"
          python3 -B - <<'PYCODE'
          from dataclasses import asdict
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'hack/kernel-minikube')
          from identity import Workflow
          Path(os.environ['RUNNER_TEMP'], 'chaos-kernel-image/workflow.json').write_text(json.dumps(asdict(Workflow.current())))
          PYCODE
      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'amd64'
        with:
          name: chaos-kernel-amd64-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chaos-kernel-image/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kernel-image-${{ matrix.arch }}-build-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-image-build/
          if-no-files-found: error

  image-runtime:
    needs: kernel-image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: chaos-mesh/bpfki
          ref: ea3e0906d657ee774c0aaf9b2dd1f30d7197b938
          path: .kernel-image-bpfki
          persist-credentials: false
      - name: Fetch the immutable original-source control
        run: git -C .kernel-image-bpfki fetch --depth 1 origin 2825d3832c9230ab6e26e8a47ed6de8d16ea5ae3
      - uses: actions/download-artifact@v8
        with:
          name: chaos-kernel-amd64-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chaos-kernel-image
      - name: Install guest build tools
        run: |
          mkdir -p "$RUNNER_TEMP/chaos-kernel-vm"
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y \
            build-essential python3 qemu-system-x86 e2fsprogs bison flex libelf-dev libssl-dev bc curl xz-utils
      - name: Restore the direct-test kernel cache
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bpfki/kernel
          key: bpfki-linux-6.8-amd64-ubuntu24-gcc13-${{ hashFiles('.kernel-image-bpfki/tests/kernel/vm/kernel.config', '.kernel-image-bpfki/tests/kernel/vm/build-kernel.sh') }}
          restore-keys: bpfki-linux-6.8-amd64-ubuntu24-gcc13-
      - name: Build the unchanged direct-test kernel
        run: |
          bash .kernel-image-bpfki/tests/kernel/vm/build-kernel.sh "$HOME/.cache/bpfki/kernel" \
            2>&1 | tee "$RUNNER_TEMP/chaos-kernel-vm/kernel-build.log"
          for option in CONFIG_FUNCTION_TRACER=y CONFIG_DYNAMIC_FTRACE=y \
            CONFIG_DYNAMIC_FTRACE_WITH_REGS=y CONFIG_KPROBES_ON_FTRACE=y CONFIG_OPTPROBES=y; do
            grep -Fxq "$option" "$HOME/.cache/bpfki/kernel/linux-6.8/.config"
          done
      - name: Save the direct-test kernel cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bpfki/kernel
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}
      - name: Package the exact image runtime in the guest
        run: |
          bash images/chaos-kernel/guest/build-rootfs.sh "$GITHUB_WORKSPACE/.kernel-image-bpfki" \
            "$HOME/.cache/bpfki/kernel/linux-6.8" "$RUNNER_TEMP/chaos-kernel-image" \
            "$RUNNER_TEMP/chaos-kernel-vm" 2>&1 | tee "$RUNNER_TEMP/chaos-kernel-vm/packaging.log"
      - name: Qualify all three faults in one isolated guest
        run: |
          awk '/^MemAvailable:/ { if ($2 < 4 * 1024 * 1024) exit 1; found=1 } END { if (!found) exit 1 }' /proc/meminfo
          bash .kernel-image-bpfki/tests/kernel/vm/run.sh "$HOME/.cache/bpfki/kernel/linux-6.8" \
            "$RUNNER_TEMP/chaos-kernel-vm"
          python3 images/chaos-kernel/guest/manifest.py result "$RUNNER_TEMP/chaos-kernel-vm"
      - name: Remove owned guest disk and staging
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/chaos-kernel-vm/rootfs.ext4" "$RUNNER_TEMP/chaos-kernel-image/image.tar.gz"
          rm -rf "$RUNNER_TEMP/bpfki-source-control-src"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kernel-image-amd64-runtime-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chaos-kernel-vm/
            ${{ runner.temp }}/chaos-kernel-image/*.json
            ${{ runner.temp }}/bpfki-source-control.json
          if-no-files-found: error

  component-images:
    needs: kernel-image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GO_BUILD_CACHE: ${{ github.workspace }}/cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: chaos-kernel-amd64-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chaos-kernel-image
      - name: Restore the existing shared Go build cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: e2e-image-build-cache-${{ runner.os }}
      - name: Restore pinned release assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/chaos-mesh/lifecycle/assets
          key: cm-lifecycle-assets-${{ hashFiles('images/chaos-kernel/guest/lifecycle/inputs.lock.json') }}
      - name: Check offline safety boundaries
        run: python3 -B -m unittest discover -s hack/kernel-minikube -p 'test_*.py'
      - name: Build candidate components and both native guard modes
        run: |
          python3 -B hack/kernel-minikube/produce.py "$RUNNER_TEMP/chaos-kernel-image" "$RUNNER_TEMP/minikube-inputs"
      - uses: actions/upload-artifact@v7
        with:
          name: cm-minikube-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/minikube-inputs/
          compression-level: 0
          if-no-files-found: error

  qualification:
    if: always()
    needs: [kernel-image, component-images, image-runtime, minikube-lifecycle]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every producer and runtime qualification
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          expected = {'kernel-image', 'component-images', 'image-runtime', 'minikube-lifecycle'}
          assert set(jobs) == expected and all(job['result'] == 'success' for job in jobs.values()), jobs
          PY
