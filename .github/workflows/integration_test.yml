name: Integration Test

on:
  pull_request:
    branches:
      - master
    paths:
      - "**"
      - "!.gitignore"
      - "!**.md"
      - "!ui/**"
      - "!.github/workflows/**"
      - ".github/workflows/integration_test.yml"

permissions: read-all

jobs:
  run:
    name: Integration Test
    strategy:
      matrix:
        arch: [amd64]
    runs-on: ${{ fromJSON('{"amd64":"ubuntu-22.04"}')[matrix.arch] }}
    steps:
      - uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v7
        with:
          # Must use at least depth 2!
          fetch-depth: 2

      - name: Setup minikube
        uses: medyagh/setup-minikube@latest
        with:
          minikube-version: 1.35.0

      - name: Restrict access to kubeconfig # https://github.com/helm/helm/issues/9115
        run: chmod 600 ~/.kube/config

      - name: Build Chaos Mesh Build Env
        if: ${{ github.event.pull_request }}
        uses: ./.github/actions/build-chaos-mesh-build-env

      - name: Build Chaos Mesh Dev Env
        if: ${{ github.event.pull_request }}
        env:
          IMAGE_DEV_ENV_BUILD: ${{ contains(github.event.pull_request.labels.*.name, 'rebuild-dev-env-image') }}
        run: |
          if [ "${IMAGE_DEV_ENV_BUILD}" = "true" ] ; then
            export IMAGE_DEV_ENV_BUILD=1;
          else
            export IMAGE_DEV_ENV_BUILD=0;
          fi

          make image-dev-env

      - name: Build and load Chaos Mesh images
        run: |
          make image
          minikube image load ghcr.io/chaos-mesh/chaos-mesh:latest
          minikube image load ghcr.io/chaos-mesh/chaos-daemon:latest
          minikube image load ghcr.io/chaos-mesh/chaos-dashboard:latest

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Install Chaos Mesh
        run: |
          helm install --wait --create-namespace chaos-mesh helm/chaos-mesh \
            -n=chaos-mesh --set images.tag=latest \
            --set controllerManager.chaosdSecurityMode=false

      - name: Install localstack
        run: |
          helm repo add localstack https://localstack.github.io/helm-charts
          helm install localstack localstack/localstack \
            --version 0.6.27 \
            --set image.tag=4.14.0
          kubectl wait --timeout=60s --for=condition=ready --all pod

      - name: Run integration test
        run: |
          PF_LOG="${RUNNER_TEMP}/dashboard-port-forward.log"
          kubectl port-forward -n chaos-mesh svc/chaos-dashboard 2333:2333 >"${PF_LOG}" 2>&1 &
          PF_PID=$!
          trap 'kill "${PF_PID}" 2>/dev/null || true; wait "${PF_PID}" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            rc=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:2333/api/common/config || true)
            if ! kill -0 "${PF_PID}" 2>/dev/null; then
              cat "${PF_LOG}" >&2
              echo "dashboard port-forward exited before readiness" >&2
              exit 1
            fi
            [ "${rc}" = "200" ] && break
            if [ "$i" = 30 ]; then
              cat "${PF_LOG}" >&2
              echo "dashboard not ready (last http=${rc})" >&2
              exit 1
            fi
            sleep 2
          done
          bash test/integration_test/run.sh

      - name: Run OIDC integration test
        run: |
          bash test/integration_test/oidc/run.sh

      - name: post run - dump kubernetes cluster info
        if: always()
        run: |
          kubectl cluster-info dump --all-namespaces --output-directory cluster-info-dump
      - name: post run - upload kubernetes cluster info dump
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-kubernetes-cluster-info-dump-${{ matrix.arch }}
          path: cluster-info-dump
          retention-days: 7
