{{- if and .Values.dashboard.create .Values.dashboard.httpRoute.enabled }}
{{- if not .Values.dashboard.httpRoute.parentRefs }}
{{- fail "dashboard.httpRoute.parentRefs must reference at least one Gateway when dashboard.httpRoute.enabled is true" }}
{{- end }}
{{- $paths := default (list "/") .Values.dashboard.httpRoute.paths }}
apiVersion: {{ .Values.dashboard.httpRoute.apiVersion | default "gateway.networking.k8s.io/v1" }}
kind: HTTPRoute
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ template "chaos-dashboard.svc" . }}
  labels:
    {{- include "chaos-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: chaos-dashboard
    {{- with .Values.dashboard.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.dashboard.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.dashboard.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.dashboard.httpRoute.hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        {{- range $paths }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - name: {{ template "chaos-dashboard.svc" . }}
          port: {{ .Values.dashboard.env.LISTEN_PORT }}
{{- end }}
