syntax = "proto3";

package bpfki;

message BumpTimeRequest {
  uint32 pid = 1;
  uint32 tid = 2;
  int32 second = 3;
  int32 subsecond = 4;
  float probability = 5;
}

message FailKernRequest {
  uint32 pid = 1;
  uint32 tid = 2;
  enum FAILTYPE {
    SLAB = 0;
    PAGE = 1;
    BIO = 2;
  }
  FAILTYPE ftype = 3;
  repeated string headers = 4;
  message frame {
    string funcname = 1;
    string parameters = 2;
    string predicate = 3;
  }
  repeated frame callchain = 5;
  float probability = 6;
  uint32 times = 7;
}

message FailSyscallRequest {
  uint32 pid = 1;
  uint32 tid = 2;
  repeated string methods = 3;
  uint32 err = 4;
  float probability = 5;
}

message StatusResponse {
  int32 ret = 1;
  string msg = 2;
}

message KernelFaultSession {
  string instance = 1;
  string boot_id = 2;
  uint32 pid = 3;
  uint64 start_time = 4;
  uint64 pid_namespace = 5;
}

message ReserveKernelFaultRequest {
  FailKernRequest fault = 1;
  string node_boot_id = 2;
}

message KernelFaultHandle {
  KernelFaultSession session = 1;
  string id = 2;
}

message KernelFaultReference {
  KernelFaultHandle handle = 1;
  string node_boot_id = 2;
}

message ReleaseKernelFaultResponse {
  enum Outcome {
    UNSPECIFIED = 0;
    RELEASED = 1;
    ABSENT = 2;
    SERVICE_GONE = 3;
  }
  Outcome outcome = 1;
}

service BPFKIService {
  rpc ReserveKernelFault(ReserveKernelFaultRequest) returns (KernelFaultHandle);
  rpc ArmKernelFault(KernelFaultReference) returns (StatusResponse);
  rpc ReleaseKernelFault(KernelFaultReference) returns (ReleaseKernelFaultResponse);
  rpc SetTimeVal(BumpTimeRequest) returns (StatusResponse) {}
  rpc RecoverTimeVal(BumpTimeRequest) returns (StatusResponse) {}
  rpc SetTimeSpec(BumpTimeRequest) returns (StatusResponse) {}
  rpc RecoverTimeSpec(BumpTimeRequest) returns (StatusResponse) {}
  rpc FailMMOrBIO(FailKernRequest) returns (StatusResponse) {}
  rpc RecoverMMOrBIO(FailKernRequest) returns (StatusResponse) {}
  rpc FailSyscall(FailSyscallRequest) returns (StatusResponse) {}
  rpc RecoverSyscall(FailSyscallRequest) returns (StatusResponse) {}
}
